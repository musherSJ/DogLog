<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DogLog - Dog Training Tracker</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--success:#16a34a;--success-light:#dcfce7;--danger:#dc2626;--danger-light:#fee2e2;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;--r:8px;--sh:0 1px 3px rgba(0,0,0,.1);--shm:0 4px 6px rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--g50);color:var(--g800);line-height:1.5}
a{color:var(--primary);text-decoration:none}

/* Layout */
#app{min-height:100vh;display:flex;flex-direction:column}
.navbar{background:var(--primary);color:#fff;padding:0 1rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shm)}
.navbar-brand{font-size:1.25rem;font-weight:700;color:#fff;cursor:pointer}
.nav-links{display:flex;gap:.25rem;align-items:center}
.nav-links a,.nav-links button{color:rgba(255,255,255,.9);padding:.5rem .75rem;border-radius:var(--r);font-size:.875rem;transition:background .2s;background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:none}
.nav-links a:hover,.nav-links button:hover,.nav-links a.active{background:rgba(255,255,255,.2);color:#fff}
.main{flex:1;padding:1.5rem;max-width:960px;width:100%;margin:0 auto}

/* Bottom nav */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g200);z-index:100;padding:.25rem 0;padding-bottom:env(safe-area-inset-bottom,.25rem)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;padding:.5rem 0;color:var(--g400);text-decoration:none;font-size:.625rem;gap:.125rem}
.bnav a.active{color:var(--primary)}
.bnav .ni{font-size:1.25rem}

/* Card */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:1.25rem;margin-bottom:1rem}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.card-title{font-size:1.125rem;font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem 1rem;border-radius:var(--r);font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .2s;font-family:inherit;text-decoration:none}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-dark)}
.btn-s{background:var(--success);color:#fff}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{background:#b91c1c}
.btn-o{background:#fff;border-color:var(--g300);color:var(--g700)}.btn-o:hover{background:var(--g50)}
.btn-sm{padding:.25rem .625rem;font-size:.8125rem}
.btn-lg{padding:.75rem 1.5rem;font-size:1rem}
.btn-block{width:100%}
.btn-group{display:flex;gap:.5rem}

/* Forms */
.fg{margin-bottom:1rem}
.fl{display:block;font-size:.875rem;font-weight:500;color:var(--g700);margin-bottom:.25rem}
.fi,.fs,.ft{width:100%;padding:.5rem .75rem;border:1px solid var(--g300);border-radius:var(--r);font-size:.875rem;font-family:inherit;transition:border-color .2s;background:#fff}
.fi:focus,.fs:focus,.ft:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ft{resize:vertical;min-height:80px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* Auth */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(135deg,var(--primary),#7c3aed)}
.auth-card{background:#fff;border-radius:12px;padding:2rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-title{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:.25rem}
.auth-sub{text-align:center;color:var(--g500);margin-bottom:1.5rem;font-size:.875rem}
.auth-foot{text-align:center;margin-top:1rem;font-size:.875rem;color:var(--g500)}

/* Alert */
.alert{padding:.75rem 1rem;border-radius:var(--r);font-size:.875rem;margin-bottom:1rem}
.alert-e{background:var(--danger-light);color:var(--danger)}

/* Stats */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.sc{background:#fff;border-radius:var(--r);padding:1rem;box-shadow:var(--sh);text-align:center}
.sv{font-size:1.5rem;font-weight:700;color:var(--primary)}
.sl{font-size:.75rem;color:var(--g500);text-transform:uppercase;letter-spacing:.05em}

/* Activity items */
.ai{display:flex;align-items:center;gap:1rem;padding:.875rem 0;border-bottom:1px solid var(--g100);cursor:pointer;transition:background .15s;text-decoration:none;color:inherit}
.ai:last-child{border-bottom:none}
.ai:hover{background:var(--g50);margin:0 -1.25rem;padding:.875rem 1.25rem}
.a-icon{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.125rem;flex-shrink:0}
.a-info{flex:1;min-width:0}
.a-title{font-weight:600;font-size:.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-meta{font-size:.8125rem;color:var(--g500);display:flex;gap:.75rem;flex-wrap:wrap}
.a-dogs{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.25rem}
.dtag{display:inline-block;padding:.125rem .5rem;background:var(--primary-light);color:var(--primary);border-radius:999px;font-size:.75rem;font-weight:500}

/* Dog cards */
.dc{display:flex;align-items:center;gap:1rem;padding:1rem;background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:.75rem;cursor:pointer;transition:box-shadow .2s;text-decoration:none;color:inherit}
.dc:hover{box-shadow:var(--shm)}
.dav{width:48px;height:48px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.d-info{flex:1}
.d-name{font-weight:600;font-size:1rem}
.d-breed{font-size:.8125rem;color:var(--g500)}

/* Dog checkbox */
.dcl{display:flex;flex-wrap:wrap;gap:.5rem}
.dcb{display:flex;align-items:center;gap:.375rem;padding:.375rem .75rem;border:2px solid var(--g200);border-radius:999px;cursor:pointer;font-size:.875rem;transition:all .2s;user-select:none}
.dcb.sel{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:500}

/* Record */
.rec-ov{position:fixed;inset:0;background:var(--g900);color:#fff;z-index:200;display:flex;flex-direction:column}
.rec-map{flex:1;background:var(--g700);position:relative}
.rec-panel{padding:1.5rem;text-align:center}
.rec-stats{display:flex;justify-content:space-around;margin-bottom:1.5rem}
.rsv{font-size:2rem;font-weight:700}
.rsl{font-size:.75rem;color:var(--g400);text-transform:uppercase}
.rec-btn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;transition:all .2s;color:#fff}
.rec-btn.rec{background:var(--danger)}.rec-btn.go{background:var(--success)}
.rec-acts{display:flex;align-items:center;justify-content:center;gap:2rem}

/* Page header */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.pt{font-size:1.5rem;font-weight:700}

/* Empty */
.empty{text-align:center;padding:3rem 1rem;color:var(--g400)}
.empty-i{font-size:3rem;margin-bottom:.5rem}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-t{font-size:1.25rem;font-weight:600;margin-bottom:1rem}

/* Section label */
.sec{margin-bottom:.75rem;font-size:.875rem;color:var(--g500);text-transform:uppercase;letter-spacing:.05em}
.back{display:inline-flex;align-items:center;gap:.375rem;color:var(--g500);font-size:.875rem;margin-bottom:1rem;cursor:pointer}
.back:hover{color:var(--primary)}

@media(max-width:640px){
  .nav-links{display:none}
  .bnav{display:flex}
  .main{padding:1rem;padding-bottom:5rem}
  .fr{grid-template-columns:1fr}
  .ph{flex-direction:column;align-items:flex-start;gap:.75rem}
  .sg{grid-template-columns:repeat(2,1fr)}
}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--g200);border-top-color:var(--primary);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;min-height:200px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- State & Helpers ----
const S = {
  token: localStorage.getItem('doglog_token'),
  user: null,
  page: 'login',
  pageData: null
};

function setToken(t) {
  S.token = t;
  if (t) localStorage.setItem('doglog_token', t);
  else localStorage.removeItem('doglog_token');
}

function $(sel, el) { return (el || document).querySelector(sel); }
function $$(sel, el) { return [...(el || document).querySelectorAll(sel)]; }

const ICONS = { run:'\u{1F3C3}', walk:'\u{1F6B6}', ski:'\u26F7\uFE0F', bike:'\u{1F6B2}', sled:'\u{1F6F7}', swim:'\u{1F3CA}', hike:'\u26F0\uFE0F', other:'\u2B50' };
const TYPES = [['run','Run'],['walk','Walk'],['sled','Sled'],['ski','Skijoring'],['bike','Bikejoring'],['hike','Hike'],['swim','Swim'],['other','Other']];

function icon(t) { return ICONS[t] || ICONS.other; }
function fmtDur(s) { if (!s) return '0:00'; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`; }
function fmtDist(km) { return km ? Number(km).toFixed(1) : '0.0'; }
function fmtDate(d) { if (!d) return ''; return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtPace(km,s) { if (!km||!s) return '-'; const p=s/km; return Math.floor(p/60)+':'+String(Math.floor(p%60)).padStart(2,'0')+' /km'; }
function today() { return new Date().toISOString().split('T')[0]; }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ---- API ----
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const res = await fetch('/api' + path, { ...opts, headers });
  if (res.status === 401) { setToken(null); S.user = null; nav('login'); throw new Error('Session expired'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ---- Router ----
function nav(page, data) {
  S.page = page;
  S.pageData = data || null;
  render();
}

// ---- Render ----
function render() {
  const app = $('#app');
  if (!S.user && S.page !== 'register') { S.page = 'login'; }
  if (S.user && (S.page === 'login' || S.page === 'register')) { S.page = 'dashboard'; }

  if (S.page === 'login') { app.innerHTML = loginPage(); bindLogin(); return; }
  if (S.page === 'register') { app.innerHTML = registerPage(); bindRegister(); return; }
  if (S.page === 'record') { app.innerHTML = recordPage(); bindRecord(); return; }

  // Wrap in layout
  app.innerHTML = layoutHTML() + '<div class="main" id="content"></div>' + bottomNavHTML();
  bindNav();
  const c = $('#content');

  if (S.page === 'dashboard') { c.innerHTML = '<div class="loading"><div class="spin"></div></div>'; loadDashboard(c); }
  else if (S.page === 'dogs') { c.innerHTML = '<div class="loading"><div class="spin"></div></div>'; loadDogs(c); }
  else if (S.page === 'dog-detail') { c.innerHTML = '<div class="loading"><div class="spin"></div></div>'; loadDogDetail(c); }
  else if (S.page === 'activities') { c.innerHTML = '<div class="loading"><div class="spin"></div></div>'; loadActivities(c); }
  else if (S.page === 'activity-form') { c.innerHTML = '<div class="loading"><div class="spin"></div></div>'; loadActivityForm(c); }
  else if (S.page === 'save-recording') { renderSaveRecording(c); }
  else if (S.page === 'profile') { c.innerHTML = '<div class="loading"><div class="spin"></div></div>'; loadProfile(c); }
}

// ---- Layout ----
function layoutHTML() {
  return `<nav class="navbar"><span class="navbar-brand" onclick="nav('dashboard')">DogLog</span><div class="nav-links">
    <a href="#" data-p="dashboard">Dashboard</a><a href="#" data-p="dogs">Dogs</a><a href="#" data-p="activities">Activities</a><a href="#" data-p="profile">Profile</a>
    <button onclick="logout()">Log out</button></div></nav>`;
}

function bottomNavHTML() {
  const p = S.page;
  const a = (pg) => p === pg ? 'active' : '';
  return `<nav class="bnav">
    <a href="#" data-p="dashboard" class="${a('dashboard')}"><span class="ni">\u2302</span><span>Home</span></a>
    <a href="#" data-p="dogs" class="${a('dogs')}"><span class="ni">\u{1F436}</span><span>Dogs</span></a>
    <a href="#" data-p="record" class="${a('record')}"><span class="ni">\u23FA</span><span>Record</span></a>
    <a href="#" data-p="activities" class="${a('activities')}"><span class="ni">\u2605</span><span>Activities</span></a>
    <a href="#" data-p="profile" class="${a('profile')}"><span class="ni">\u{1F464}</span><span>Profile</span></a>
  </nav>`;
}

function bindNav() {
  $$('[data-p]').forEach(el => {
    el.onclick = (e) => { e.preventDefault(); nav(el.dataset.p); };
  });
}

function logout() { setToken(null); S.user = null; nav('login'); }

// ---- Auth Pages ----
function loginPage() {
  return `<div class="auth-page"><div class="auth-card">
    <h1 class="auth-title">DogLog</h1><p class="auth-sub">Log in to track your dog training</p>
    <div id="err"></div>
    <form id="f"><div class="fg"><label class="fl">Username</label><input class="fi" name="username" required autofocus></div>
    <div class="fg"><label class="fl">Password</label><input class="fi" name="password" type="password" required></div>
    <button class="btn btn-p btn-block btn-lg" type="submit">Log in</button></form>
    <p class="auth-foot">Don't have an account? <a href="#" id="go-reg">Sign up</a></p></div></div>`;
}

function bindLogin() {
  $('#go-reg').onclick = (e) => { e.preventDefault(); nav('register'); };
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const d = await api('/users/login', { method: 'POST', body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }) });
      setToken(d.token); S.user = d.user; nav('dashboard');
    } catch (err) { $('#err').innerHTML = `<div class="alert alert-e">${esc(err.message)}</div>`; }
  };
}

function registerPage() {
  return `<div class="auth-page"><div class="auth-card">
    <h1 class="auth-title">Create Account</h1><p class="auth-sub">Start tracking your dog training</p>
    <div id="err"></div>
    <form id="f"><div class="fg"><label class="fl">Display Name</label><input class="fi" name="displayName" required autofocus placeholder="Your name"></div>
    <div class="fg"><label class="fl">Username</label><input class="fi" name="username" required minlength="3" placeholder="At least 3 characters"></div>
    <div class="fg"><label class="fl">Password</label><input class="fi" name="password" type="password" required minlength="8" placeholder="At least 8 characters"></div>
    <div class="fg"><label class="fl">Confirm Password</label><input class="fi" name="confirm" type="password" required></div>
    <button class="btn btn-p btn-block btn-lg" type="submit">Create account</button></form>
    <p class="auth-foot">Already have an account? <a href="#" id="go-login">Log in</a></p></div></div>`;
}

function bindRegister() {
  $('#go-login').onclick = (e) => { e.preventDefault(); nav('login'); };
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (fd.get('password') !== fd.get('confirm')) { $('#err').innerHTML = '<div class="alert alert-e">Passwords do not match</div>'; return; }
    try {
      const d = await api('/users/register', { method: 'POST', body: JSON.stringify({ username: fd.get('username'), password: fd.get('password'), displayName: fd.get('displayName') }) });
      setToken(d.token); S.user = d.user; nav('dashboard');
    } catch (err) { $('#err').innerHTML = `<div class="alert alert-e">${esc(err.message)}</div>`; }
  };
}

// ---- Dashboard ----
async function loadDashboard(c) {
  try {
    const [stats, activities, dogs] = await Promise.all([api('/activities/stats'), api('/activities'), api('/dogs')]);
    const recent = activities.slice(0, 5);
    c.innerHTML = `
      <div class="ph"><h1 class="pt">Welcome, ${esc(S.user.displayName)}</h1>
        <div class="btn-group"><a href="#" class="btn btn-s" onclick="event.preventDefault();nav('record')">Record Activity</a>
        <a href="#" class="btn btn-p" onclick="event.preventDefault();nav('activity-form')">Add Manual</a></div></div>
      <div class="sec">This Week</div>
      <div class="sg">
        <div class="sc"><div class="sv">${stats.recentWeek.activities}</div><div class="sl">Activities</div></div>
        <div class="sc"><div class="sv">${fmtDist(stats.recentWeek.distance_km)}</div><div class="sl">Distance (km)</div></div>
        <div class="sc"><div class="sv">${fmtDur(stats.recentWeek.duration_seconds)}</div><div class="sl">Duration</div></div>
      </div>
      <div class="sec">All Time</div>
      <div class="sg">
        <div class="sc"><div class="sv">${stats.overall.total_activities}</div><div class="sl">Activities</div></div>
        <div class="sc"><div class="sv">${fmtDist(stats.overall.total_distance_km)}</div><div class="sl">Total km</div></div>
        <div class="sc"><div class="sv">${fmtDur(stats.overall.total_duration_seconds)}</div><div class="sl">Total Time</div></div>
        <div class="sc"><div class="sv">${dogs.length}</div><div class="sl">Dogs</div></div>
      </div>
      <div class="card"><div class="card-hdr"><span class="card-title">Recent Activities</span>
        <a href="#" class="btn btn-o btn-sm" onclick="event.preventDefault();nav('activities')">View all</a></div>
        ${recent.length === 0 ? '<div class="empty"><div class="empty-i">\u{1F3C3}</div><p>No activities yet. Record or add your first one!</p></div>' :
          recent.map(a => activityItemHTML(a)).join('')}
      </div>`;
  } catch (err) { c.innerHTML = `<div class="alert alert-e">${esc(err.message)}</div>`; }
}

function activityItemHTML(a) {
  const dogs = (a.dogs||[]).map(d => `<span class="dtag">${esc(d.name)}</span>`).join('');
  return `<div class="ai" onclick="nav('activity-form',{id:${a.id}})">
    <div class="a-icon">${icon(a.type)}</div><div class="a-info"><div class="a-title">${esc(a.title)}</div>
    <div class="a-meta"><span>${fmtDate(a.date)}</span><span>${fmtDist(a.distance_km)} km</span><span>${fmtDur(a.duration_seconds)}</span></div>
    ${dogs ? `<div class="a-dogs">${dogs}</div>` : ''}</div></div>`;
}

// ---- Dogs ----
async function loadDogs(c) {
  try {
    const dogs = await api('/dogs');
    c.innerHTML = `<div class="ph"><h1 class="pt">My Dogs</h1>
      <button class="btn btn-p" onclick="showDogModal()">+ Add Dog</button></div>
      <div id="dog-list">${dogs.length === 0 ? '<div class="empty"><div class="empty-i">\u{1F436}</div><p>No dogs added yet. Add your first dog!</p></div>' :
        dogs.map(d => `<div class="dc" onclick="nav('dog-detail',{id:${d.id}})">
          <div class="dav">\u{1F436}</div><div class="d-info"><div class="d-name">${esc(d.name)}</div>
          <div class="d-breed">${[d.breed, d.weight_kg?d.weight_kg+' kg':null].filter(Boolean).join(' \u00B7 ')}</div></div>
          <div class="btn-group"><button class="btn btn-o btn-sm" onclick="event.stopPropagation();showDogModal(${d.id})">Edit</button>
          <button class="btn btn-d btn-sm" onclick="event.stopPropagation();deleteDog(${d.id},'${esc(d.name)}')">Delete</button></div></div>`).join('')}</div>
      <div id="dog-modal"></div>`;
    window._dogs = dogs;
  } catch (err) { c.innerHTML = `<div class="alert alert-e">${esc(err.message)}</div>`; }
}

window.showDogModal = async function(id) {
  let dog = id ? (window._dogs||[]).find(d=>d.id===id) : null;
  if (id && !dog) { try { dog = await api('/dogs/'+id); } catch(e) {} }
  const m = $('#dog-modal');
  m.innerHTML = `<div class="modal-ov" onclick="$('#dog-modal').innerHTML=''"><div class="modal" onclick="event.stopPropagation()">
    <h2 class="modal-t">${dog?'Edit Dog':'Add Dog'}</h2><div id="dog-err"></div>
    <form id="dog-f">
      <div class="fg"><label class="fl">Name *</label><input class="fi" name="name" required autofocus value="${dog?esc(dog.name):''}"></div>
      <div class="fr"><div class="fg"><label class="fl">Breed</label><input class="fi" name="breed" value="${dog&&dog.breed?esc(dog.breed):''}" placeholder="e.g. Alaskan Husky"></div>
      <div class="fg"><label class="fl">Weight (kg)</label><input class="fi" name="weightKg" type="number" step="0.1" value="${dog&&dog.weight_kg?dog.weight_kg:''}"></div></div>
      <div class="fg"><label class="fl">Birth Date</label><input class="fi" name="birthDate" type="date" value="${dog&&dog.birth_date?dog.birth_date:''}"></div>
      <div class="fg"><label class="fl">Notes</label><textarea class="ft" name="notes">${dog&&dog.notes?esc(dog.notes):''}</textarea></div>
      <div class="btn-group"><button class="btn btn-p" type="submit">${dog?'Save Changes':'Add Dog'}</button>

            <input class="fi" name="minutes" type="number" min="0" max="59" placeholder="Minutes" value="${m||''}">

        <button class="btn btn-o" type="button" onclick="nav('activities')">Cancel</button></div>

// ---- Record Activity ----
let rec = { status:'idle', elapsed:0, distance:0, track:[], watchId:null, timer:null, startTime:null, pausedElapsed:0, lastPos:null };

function haversine(a,b) {
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function recordPage() {
  return `<div class="rec-ov"><div class="rec-map"><div style="position:absolute;top:1rem;left:1rem;right:1rem;display:flex;justify-content:space-between;align-items:center">
    <span style="color:#fff;cursor:pointer;font-size:.875rem" onclick="cancelRec()">\u2190 Cancel</span>
    <span id="gps-info" style="color:rgba(255,255,255,.7);font-size:.75rem">Waiting for GPS...</span></div>
    <div id="geo-err" style="position:absolute;bottom:1rem;left:1rem;right:1rem;display:none;background:rgba(220,38,38,.9);color:#fff;padding:.75rem;border-radius:8px;font-size:.875rem"></div>
    <div id="rec-msg" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.3);font-size:1.25rem">Press start to begin recording</div></div>
    <div class="rec-panel"><div class="rec-stats">
      <div><div class="rsv" id="r-dist">0.0</div><div class="rsl">km</div></div>
      <div><div class="rsv" id="r-dur">0:00</div><div class="rsl">Duration</div></div>
      <div><div class="rsv" id="r-pace">-</div><div class="rsl">Pace /km</div></div></div>
      <div class="rec-acts" id="r-btns"></div></div></div>`;
}

function bindRecord() {
  updateRecUI();
}

function updateRecUI() {
  const d = $('#r-dist'); const t = $('#r-dur'); const p = $('#r-pace');
  if (d) d.textContent = fmtDist(rec.distance);
  if (t) t.textContent = fmtDur(rec.elapsed);
  if (p) p.textContent = rec.distance > 0.01 ? fmtDur(Math.round(rec.elapsed/rec.distance)) : '-';
  const info = $('#gps-info');
  if (info) info.textContent = rec.track.length > 0 ? rec.track.length + ' GPS points' : 'Waiting for GPS...';
  const msg = $('#rec-msg');
  if (msg) msg.textContent = rec.status === 'idle' ? 'Press start to begin recording' : rec.status === 'recording' ? 'Recording...' : 'Paused';
  const btns = $('#r-btns');
  if (!btns) return;
  if (rec.status === 'idle') {
    btns.innerHTML = '<button class="rec-btn go" onclick="startRec()">\u25B6</button>';
  } else if (rec.status === 'recording') {
    btns.innerHTML = `<button class="btn btn-o" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="discardRec()">Discard</button>
      <button class="rec-btn rec" onclick="pauseRec()">\u23F8</button>
      <button class="btn btn-o" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="finishRec()">Finish</button>`;
  } else if (rec.status === 'paused') {
    btns.innerHTML = `<button class="btn btn-o" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="discardRec()">Discard</button>
      <button class="rec-btn go" onclick="resumeRec()">\u25B6</button>
      <button class="btn btn-o" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="finishRec()">Finish</button>`;
  }
}

function startGeo() {
  if (!navigator.geolocation) { const e=$('#geo-err'); if(e){e.style.display='block';e.textContent='Geolocation not supported';} return false; }
  rec.watchId = navigator.geolocation.watchPosition(pos => {
    const e=$('#geo-err'); if(e) e.style.display='none';
    const pt = { lat:pos.coords.latitude, lng:pos.coords.longitude, time:Date.now(), accuracy:pos.coords.accuracy };
    if (rec.lastPos && pos.coords.accuracy < 50) {
      const d = haversine(rec.lastPos, pt);
      if (d > 0.002) { rec.distance += d; rec.lastPos = pt; }
    } else if (!rec.lastPos) { rec.lastPos = pt; }
    rec.track.push(pt);
    updateRecUI();
  }, err => { const e=$('#geo-err'); if(e){e.style.display='block';e.textContent='Location error: '+err.message;} },
  { enableHighAccuracy:true, maximumAge:5000, timeout:10000 });
  return true;
}

function stopGeo() { if (rec.watchId !== null) { navigator.geolocation.clearWatch(rec.watchId); rec.watchId = null; } }

window.startRec = function() {
  if (startGeo() === false) return;
  rec.status = 'recording';
  rec.startTime = Date.now();
  rec.pausedElapsed = rec.elapsed;
  rec.timer = setInterval(() => { rec.elapsed = rec.pausedElapsed + Math.floor((Date.now()-rec.startTime)/1000); updateRecUI(); }, 1000);
  updateRecUI();
};

window.pauseRec = function() {
  rec.status = 'paused';
  clearInterval(rec.timer);
  rec.pausedElapsed = rec.elapsed;
  stopGeo();
  updateRecUI();
};

window.resumeRec = function() {
  rec.status = 'recording';
  rec.startTime = Date.now();
  rec.timer = setInterval(() => { rec.elapsed = rec.pausedElapsed + Math.floor((Date.now()-rec.startTime)/1000); updateRecUI(); }, 1000);
  startGeo();
  updateRecUI();
};

window.finishRec = function() {
  clearInterval(rec.timer); stopGeo();
  S.pageData = { distance: rec.distance, elapsed: rec.elapsed, track: rec.track };
  resetRec();
  nav('save-recording');
};

window.discardRec = function() {
  if (!confirm('Discard this activity?')) return;
  clearInterval(rec.timer); stopGeo(); resetRec(); nav('dashboard');
};

window.cancelRec = function() {
  if (rec.status !== 'idle' && !confirm('Cancel recording? Data will be lost.')) return;
  clearInterval(rec.timer); stopGeo(); resetRec(); nav('dashboard');
};

function resetRec() { rec = { status:'idle', elapsed:0, distance:0, track:[], watchId:null, timer:null, startTime:null, pausedElapsed:0, lastPos:null }; }

        <div class="fg"><label class="fl">Dogs</label>${dogChecks}</div>
        <div class="fg"><label class="fl">Notes</label><textarea class="ft" name="notes" placeholder="How did it go?"></textarea></div>

    $$('.dcb').forEach(el => { el.onclick = () => el.classList.toggle('sel'); });
    $('#sf').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const dogIds = $$('.dcb.sel').map(el => Number(el.dataset.did));
      const title = fd.get('title') || (fd.get('type').charAt(0).toUpperCase()+fd.get('type').slice(1)+' Activity');

      } catch(err) { alert(err.message); }
    };
  });
}
